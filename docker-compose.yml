version: '3.9'

services:
  backend:
    build:
      context: ./backend
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - CLIENT_URL=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3001,http://127.0.0.1:3001
    restart: unless-stopped
    networks:
      - ecommerce-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  admin:
    build:
      context: ./admin
    ports:
      - '3001:80'
    restart: unless-stopped
    networks:
      - ecommerce-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  ecommerce-network:
    driver: bridge
