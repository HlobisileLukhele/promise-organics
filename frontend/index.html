<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/promise-logo.png" />
    <link rel="apple-touch-icon" href="/assets/promise-logo.png" />

    <!-- Primary SEO -->
    <title>Promise Organics | 100% Natural & Organic Haircare South Africa</title>
    <meta name="description" content="Promise Organics offers 100% natural and certified organic haircare products infused with avocado and rosemary. Cruelty-free, eco-friendly. Shop online and deliver nationwide across South Africa." />
    <meta name="keywords" content="organic haircare South Africa, natural hair products, avocado rosemary hair oil, cruelty free haircare, organic shampoo South Africa, natural conditioner, Promise Organics, eco-friendly beauty, organic beauty South Africa" />
    <meta name="author" content="Promise Organics" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#4a7c59" />
    <link rel="canonical" href="https://promiseorganics.co.za/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Promise Organics" />
    <meta property="og:title" content="Promise Organics | 100% Natural & Organic Haircare South Africa" />
    <meta property="og:description" content="Shop 100% natural, certified organic haircare products infused with avocado and rosemary. Cruelty-free & eco-friendly. Nationwide delivery in South Africa." />
    <meta property="og:url" content="https://promiseorganics.co.za/" />
    <meta property="og:image" content="https://promiseorganics.co.za/assets/promise-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Geo targeting (South Africa) -->
    <meta name="geo.region" content="ZA" />
    <meta name="geo.placename" content="South Africa" />
    <meta name="ICBM" content="-30.5595, 22.9375" />

    <!-- Structured Data (Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Promise Organics",
      "url": "https://promiseorganics.co.za",
      "logo": "https://promiseorganics.co.za/assets/promise-logo.png",
      "description": "100% Natural and certified organic haircare products infused with avocado and rosemary. Cruelty-free and eco-friendly.",
      "email": "jeniselukhele@gmail.com",
      "areaServed": "ZA",
      "sameAs": []
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Promise Organics",
      "url": "https://promiseorganics.co.za",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://promiseorganics.co.za/shop?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
